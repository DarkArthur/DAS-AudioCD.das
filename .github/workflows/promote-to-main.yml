name: Promote development to main

# Dopo ogni merge su development apre (se serve) la PR development -> main
# e abilita l'auto-merge: la PR si fonde quando i controlli richiesti passano.
on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      # Un token diverso da GITHUB_TOKEN e' necessario perche' le PR create
      # con GITHUB_TOKEN non avviano i workflow CI (controlli richiesti mai eseguiti).
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or update PR development -> main
        run: |
          # Auto-merge richiede branch protection (piano Pro o repo pubblico).
          # In mancanza: attende i check della PR e poi fonde.
          # Waits only for the checks of the "CI" workflow. The PR head commit also carries the checks of the workflow
          # that is running this script, so waiting for "all checks" never ends once they are visible (public repo).
          wait_ci() {
            for _ in $(seq 1 120); do
              rows=$(gh pr view "$1" --json statusCheckRollup \
                --jq '[.statusCheckRollup[] | select(.workflowName == "CI")] | map("\(.status) \(.conclusion // "")") | .[]')
              if [ -n "$rows" ] && ! echo "$rows" | grep -qv '^COMPLETED'; then
                if echo "$rows" | grep -Eq 'FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE'; then
                  echo "CI non superata sulla PR #$1:"; echo "$rows"; return 1
                fi
                echo "CI superata sulla PR #$1."; return 0
              fi
              sleep 20
            done
            echo "Timeout in attesa della CI sulla PR #$1."; return 1
          }
          merge_pr() {
            if gh pr merge "$1" --auto --merge 2>/dev/null; then
              echo "Auto-merge abilitato su PR #$1"
              return 0
            fi
            echo "Auto-merge non disponibile: attendo i check e fondo."
            sleep 30
            wait_ci "$1"
            gh pr merge "$1" --merge
          }
          ahead=$(git rev-list --count origin/main..origin/development)
          if [ "$ahead" -eq 0 ]; then
            echo "development non ha commit nuovi rispetto a main."
            exit 0
          fi

          num=$(gh pr list --base main --head development --state open --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh pr create --base main --head development \
              --title "chore: promote development to main" \
              --body "Promozione automatica di \`development\` su \`main\`. Il merge usa un merge commit per conservare i Conventional Commits letti da release-please."
            num=$(gh pr list --base main --head development --state open --json number --jq '.[0].number')
          fi

          # Auto-merge con merge commit (non squash): release-please legge i singoli commit.
          merge_pr "$num"
